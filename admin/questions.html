<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Questions — Admin</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div class="admin-header-top">
        <div class="admin-header-title">
          <button class="admin-back-btn" onclick="window.location.href='dashboard.html'">←</button>
          <div>
            <h2>Questions</h2>
            <p>Add, search & manage MCQs</p>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div id="statsBar" style="margin-bottom:16px"></div>

      <div class="action-row" style="margin-bottom:16px">
        <button class="btn btn-admin" onclick="openCreateQuestion()" style="flex:1">+ Single</button>
        <button class="btn btn-primary" onclick="openBulkImport()" style="flex:2">📦 Bulk Import</button>
      </div>

      <!-- Search Bar -->
      <div style="position:relative;margin-bottom:16px">
        <input
          type="text"
          id="questionSearch"
          class="input-full"
          placeholder="Search questions..."
          oninput="filterQuestionsBySearch()"
          style="padding-left:44px"
        />
        <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;opacity:0.5;pointer-events:none">🔍</span>
      </div>

      <div id="questionsList"></div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-questions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Questions — Admin</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div class="admin-header-top">
        <div class="admin-header-title">
          <button class="admin-back-btn" onclick="window.location.href='dashboard.html'">←</button>
          <div>
            <h2>Questions</h2>
            <p>Add & manage MCQs</p>
          </div>
        </div>
        <button class="admin-btn admin-btn-primary" onclick="openCreateQuestion()">
          + Add
        </button>
      </div>
    </header>

    <main class="admin-main">
      <div id="statsBar" style="margin-bottom:16px"></div>
      <div id="questionsList"></div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-questions.js"></script>
</body>
</html>

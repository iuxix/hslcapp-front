<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Generation — Admin</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/custom-select.css" />
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div class="admin-header-top">
        <div class="admin-header-title">
          <button class="admin-back-btn" onclick="window.location.href='dashboard.html'">←</button>
          <div>
            <h2>🤖 AI Generation</h2>
            <p id="statusText">Checking connection...</p>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <!-- Status Card -->
      <div id="statusCard" style="margin-bottom:20px"></div>

      <!-- Form -->
      <div class="info-card" style="padding:0;overflow:hidden">

        <!-- Section: Subject -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="width:24px;height:24px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">1</span>
            <span style="font-size:13px;font-weight:800;color:var(--color-text)">Subject</span>
          </div>
          <div id="subjectSelectWrapper"></div>
        </div>

        <!-- Section: Chapter -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="width:24px;height:24px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">2</span>
            <span style="font-size:13px;font-weight:800;color:var(--color-text)">Chapter</span>
          </div>
          <div id="chapterSelectWrapper"></div>
        </div>

        <!-- Section: Difficulty -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="width:24px;height:24px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">3</span>
            <span style="font-size:13px;font-weight:800;color:var(--color-text)">Difficulty</span>
          </div>
          <div class="chip-row" id="difficultyChips">
            <button class="chip active" data-diff="easy" onclick="selectDifficulty(this)">🌱 Easy</button>
            <button class="chip" data-diff="hard" onclick="selectDifficulty(this)">🔥 Hard</button>
          </div>
        </div>

        <!-- Section: Count -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="width:24px;height:24px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">4</span>
            <span style="font-size:13px;font-weight:800;color:var(--color-text)">How many questions?</span>
          </div>
          <div class="chip-row" id="countChips">
            <button class="chip" data-count="5" onclick="selectCount(this)">5</button>
            <button class="chip active" data-count="10" onclick="selectCount(this)">10</button>
            <button class="chip" data-count="15" onclick="selectCount(this)">15</button>
            <button class="chip" data-count="20" onclick="selectCount(this)">20</button>
          </div>
        </div>

        <!-- Section: Material -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span style="width:24px;height:24px;border-radius:50%;background:var(--color-warning);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800">5</span>
            <span style="font-size:13px;font-weight:800;color:var(--color-text)">Study Material</span>
            <span class="badge badge-muted" style="font-size:9px">OPTIONAL</span>
          </div>
          <textarea id="materialInput" class="textarea-full" placeholder="Paste chapter content here — AI will use this as the primary source." style="min-height:100px"></textarea>
          <div style="font-size:11px;color:var(--color-text-muted);margin-top:8px;line-height:1.5">
            💡 Leave empty to use general knowledge. For best results, provide chapter content.
          </div>
        </div>

        <!-- Section: Generate -->
        <div style="padding:18px 20px;background:var(--color-bg)">
          <button class="btn btn-primary btn-block" id="generateBtn" onclick="generateQuestions()" style="min-height:52px;font-size:15px">
            ✨ Generate Questions with AI
          </button>
        </div>
      </div>

      <!-- Results -->
      <div id="resultArea" style="margin-top:24px"></div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/custom-select.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-ai.js"></script>
</body>
</html>

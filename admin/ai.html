<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Generation — Admin</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/exam-start.css" />
  <link rel="stylesheet" href="../css/custom-select.css" />
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div class="admin-header-top">
        <div class="admin-header-title">
          <button class="admin-back-btn" onclick="window.location.href='dashboard.html'">←</button>
          <div>
            <h2>🤖 AI Generation</h2>
            <p id="statusText">Checking connection...</p>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div id="statusCard" style="margin-bottom:20px"></div>

      <div class="info-card" style="padding:0;overflow:hidden">

        <!-- 1. Subject -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span class="ai-step-num">1</span>
            <span class="ai-step-label">Subject</span>
          </div>
          <div id="subjectSelectWrapper"></div>
        </div>

        <!-- 2. Chapter -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span class="ai-step-num">2</span>
            <span class="ai-step-label">Chapter</span>
          </div>
          <div id="chapterSelectWrapper"></div>
        </div>

        <!-- 3. Difficulty -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span class="ai-step-num">3</span>
            <span class="ai-step-label">Difficulty</span>
          </div>
          <div class="chip-row" id="difficultyChips">
            <button type="button" class="chip active" data-diff="easy" onclick="selectDifficulty(this)">🌱 Easy</button>
            <button type="button" class="chip" data-diff="hard" onclick="selectDifficulty(this)">🔥 Hard</button>
          </div>
        </div>

        <!-- 4. Count -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span class="ai-step-num">4</span>
            <span class="ai-step-label">Number of Questions</span>
          </div>

          <!-- Quick chips -->
          <div class="chip-row" style="margin-bottom:12px" id="countChips">
            <button type="button" class="chip" data-count="5" onclick="selectCount(this)">5</button>
            <button type="button" class="chip active" data-count="10" onclick="selectCount(this)">10</button>
            <button type="button" class="chip" data-count="15" onclick="selectCount(this)">15</button>
            <button type="button" class="chip" data-count="20" onclick="selectCount(this)">20</button>
          </div>

          <!-- Custom input -->
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:12px;font-weight:700;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.05em">Custom:</span>
            <input
              type="number"
              id="customCount"
              min="1"
              max="20"
              placeholder="Enter 1-20"
              class="input-full"
              style="flex:1;padding:10px 14px;font-size:14px;font-weight:700"
              oninput="onCustomCountInput(this)"
            />
          </div>
          <div style="font-size:11px;color:var(--color-text-muted);margin-top:8px">
            ⚡ Max 20 questions per generation (Gemini limit)
          </div>
        </div>

        <!-- 5. Material -->
        <div style="padding:18px 20px;border-bottom:1px solid var(--color-border)">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <span class="ai-step-num" style="background:var(--color-warning)">5</span>
            <span class="ai-step-label">Study Material</span>
            <span class="badge badge-muted" style="font-size:9px">OPTIONAL</span>
          </div>
          <textarea id="materialInput" class="textarea-full" placeholder="Paste chapter content here — AI will use this as the primary source." style="min-height:100px"></textarea>
          <div style="font-size:11px;color:var(--color-text-muted);margin-top:8px;line-height:1.5">
            💡 Leave empty to use general knowledge. For best results, provide chapter content.
          </div>
        </div>

        <!-- Generate -->
        <div style="padding:18px 20px;background:var(--color-bg)">
          <button class="btn btn-primary btn-block" id="generateBtn" onclick="generateQuestions()" style="min-height:52px;font-size:15px">
            ✨ Generate Questions with AI
          </button>
        </div>
      </div>

      <div id="resultArea" style="margin-top:24px"></div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <style>
    /* Step numbers */
    .ai-step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .ai-step-label {
      font-size: 13px;
      font-weight: 800;
      color: var(--color-text);
    }

    /* Chips — FIXED */
    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 10px 18px;
      background: var(--color-card);
      border: 1.5px solid var(--color-border);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 180ms cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .chip:active {
      transform: scale(0.95);
    }

    .chip.active {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
      transform: translateY(-1px);
    }
  </style>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/custom-select.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-ai.js"></script>
</body>
</html>

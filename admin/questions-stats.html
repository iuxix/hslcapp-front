<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Stats — Admin</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/stats.css" />
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div class="admin-header-top">
        <div class="admin-header-title">
          <button class="admin-back-btn" onclick="window.location.href='dashboard.html'">←</button>
          <div>
            <h2>📊 Question Stats</h2>
            <p>Subject & chapter-wise count</p>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-main" id="statsMain">
      <div class="admin-loading">
        <div class="admin-spinner"></div>
        <div class="admin-loading-text">Loading stats...</div>
      </div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    (async function () {
      if (!requireAdmin()) return;
      const main = document.getElementById("statsMain");

      try {
        const data = await API.get("/api/admin/questions-count");

        // Find max chapter count for bar scaling
        let maxCount = 1;
        data.subjects.forEach((subj) => {
          subj.chapters.forEach((ch) => {
            if (ch.count > maxCount) maxCount = ch.count;
          });
        });

        let html = `
          <!-- Hero Stats -->
          <div class="stats-hero">
            <div class="stats-hero-icon">❓</div>
            <div class="stats-hero-value">${data.total_questions}</div>
            <div class="stats-hero-label">Total Questions</div>
            <div class="stats-hero-sub">
              ${data.subjects.length} subject${data.subjects.length !== 1 ? "s" : ""} · ${data.subjects.reduce((s, x) => s + x.chapters.length, 0)} chapters
            </div>
          </div>
        `;

        if (data.subjects.length === 0) {
          html += `
            <div class="admin-empty">
              <div class="admin-empty-icon">📊</div>
              <div class="admin-empty-title">No data yet</div>
              <div class="admin-empty-text">Add subjects and questions first</div>
            </div>
          `;
          main.innerHTML = html;
          return;
        }

        // Subject cards
        data.subjects.forEach((subj, idx) => {
          const colors = ["indigo", "teal", "amber", "rose", "purple", "pink"];
          const color = colors[idx % colors.length];

          html += `
            <section class="subject-stats-card" data-color="${color}">
              <div class="subject-stats-header">
                <div class="subject-stats-icon">📚</div>
                <div class="subject-stats-info">
                  <div class="subject-stats-name">${escapeHtml(subj.subject_name)}</div>
                  <div class="subject-stats-meta">${subj.chapters.length} chapters</div>
                </div>
                <div class="subject-stats-count">
                  <div class="count-num">${subj.total_questions}</div>
                  <div class="count-label">Q</div>
                </div>
              </div>

              <div class="subject-stats-body">
                ${subj.chapters.length === 0
                  ? `<div class="no-chapters">No chapters in this subject</div>`
                  : subj.chapters.map((ch) => {
                      const pct = maxCount > 0 ? Math.round((ch.count / maxCount) * 100) : 0;
                      const status = ch.count === 0 ? "empty" : ch.count < 5 ? "low" : "good";
                      return `
                        <div class="chapter-stat-row">
                          <div class="chapter-stat-info">
                            <div class="chapter-stat-name">${escapeHtml(ch.chapter_name)}</div>
                            <div class="chapter-stat-section">${escapeHtml(ch.section_name)}</div>
                          </div>
                          <div class="chapter-stat-right">
                            <div class="chapter-stat-bar">
                              <div class="chapter-stat-bar-fill" data-status="${status}" style="width:${pct}%"></div>
                            </div>
                            <div class="chapter-stat-count" data-status="${status}">${ch.count}</div>
                          </div>
                        </div>
                      `;
                    }).join("")
                }
              </div>
            </section>
          `;
        });

        // Legend
        html += `
          <div class="stats-legend">
            <div class="legend-row">
              <span class="legend-dot" data-status="good"></span>
              <span>5+ questions (good)</span>
            </div>
            <div class="legend-row">
              <span class="legend-dot" data-status="low"></span>
              <span>1-4 questions (low)</span>
            </div>
            <div class="legend-row">
              <span class="legend-dot" data-status="empty"></span>
              <span>0 questions (empty)</span>
            </div>
          </div>
        `;

        main.innerHTML = html;

      } catch (e) {
        console.error(e);
        main.innerHTML = `
          <div class="admin-empty">
            <div class="admin-empty-icon">❌</div>
            <div class="admin-empty-title">Failed to load</div>
            <div class="admin-empty-text">${escapeHtml(e.message)}</div>
          </div>
        `;
      }
    })();

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t;
      return d.innerHTML;
    }
  </script>
</body>
</html>

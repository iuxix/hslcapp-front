<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Perficiently</title>
  
  <!-- ✅ Favicon -->
  <link rel="icon" type="image/png" href="images/favicon.png" />
  
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/auth.css" />

  <!-- ✅ Premium Branding Style -->
  <style>
    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo-wrapper {
      width: 90px; /* Wrapper bada kiya */
      height: 90px;
      background: transparent; /* Background hataya */
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .brand-logo-wrapper img {
      width: 80px; /* Logo bada kiya */
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
    }
    .brand-name {
      font-size: 28px;
      font-weight: 900;
      color: #0F172A;
      letter-spacing: -0.04em;
      margin: 0 0 4px 0;
    }
    .brand-name span {
      color: #2563EB; /* Perficiently Blue accent */
    }
    .brand-tag {
      font-size: 13px;
      color: #64748B;
      font-weight: 500;
    }
  </style>
</head>
<body class="auth-body">
  <div class="auth-shell">
    
    <!-- ✅ Premium Brand Section -->
    <div class="auth-brand">
      <div class="brand-logo-wrapper">
        <img src="images/logo.png" alt="Perficiently Logo" />
      </div>
      <h1 class="brand-name">Perficient<span>ly</span></h1>
      <p class="brand-tag">Class 10 Study Platform</p>
    </div>

    <div class="auth-card">
      <div class="auth-card-header">
        <h2>Welcome back</h2>
        <p>Login to continue your practice</p>
      </div>

      <form id="studentLoginForm" class="auth-form" autocomplete="on">
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Toggle password">👁️</button>
          </div>
        </div>

        <div id="loginError" class="form-error" hidden></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Login →
        </button>
      </form>

      <div class="auth-footer">
        <p>Need an account? <strong>Contact admin</strong></p>
      </div>
    </div>

    <p class="admin-link">
      <a href="admin/login.html">Admin login →</a>
    </p>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

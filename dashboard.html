<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Perficiently</title>
  
  <!-- ✅ Favicon -->
  <link rel="icon" type="image/png" href="images/favicon.png" />
  
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />

  <!-- ✅ Professional Branding & Colors -->
  <style>
    /* Action Box Colors */
    .action-box-deep-purple, .action-box-primary {
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%) !important;
      box-shadow: 0 8px 24px -6px rgba(37, 99, 235, 0.5) !important;
    }
    .action-box-teal {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%) !important;
      box-shadow: 0 8px 24px -6px rgba(16, 185, 129, 0.5) !important;
    }
    .fab {
      background: linear-gradient(135deg, #3B82F6, #2563EB) !important;
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45) !important;
    }

    /* Premium Brand Header */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-logo-box {
      width: 48px; /* Box thoda bada kiya */
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-logo-box img {
      width: 42px; /* Logo bada kiya */
      height: auto;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); /* Premium shadow */
    }
    .brand-name {
      font-size: 22px; /* Text bada kiya */
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
      margin: 0;
    }
    .brand-name span {
      color: #60A5FA; /* Blue accent for "ly" */
    }
    .brand-subtitle {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      
      <!-- ✅ PREMIUM BRAND HEADER -->
      <div class="brand-header">
        <div class="brand-logo-box">
          <img src="images/logo.png" alt="Perficiently Logo" />
        </div>
        <div>
          <h1 class="brand-name">Perficient<span>ly</span></h1>
          <div class="brand-subtitle">Class 10 Study Platform</div>
        </div>
      </div>

      <div class="header-top">
        <div class="header-greeting">
          <h2 id="greetingName">Hi, Student 👋</h2>
          <p>Class 10 • Perficiently</p>
        </div>
        <div class="header-avatar" id="userAvatar" onclick="goTo('profile.html')">S</div>
      </div>

      <div class="header-stats">
        <div class="header-stat">
          <div class="stat-value" id="statTests">0</div>
          <div class="stat-label">Tests</div>
        </div>
        <div class="header-stat">
          <div class="stat-value" id="statAccuracy">--</div>
          <div class="stat-label">Accuracy</div>
        </div>
        <div class="header-stat">
          <div class="stat-value" id="statAvg">--</div>
          <div class="stat-label">Avg Time</div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="section">
        <button class="action-box action-box-primary action-box-large" onclick="startExam()">
          <div class="box-icon">🎯</div>
          <div class="box-content">
            <div class="box-title-large">Start Exam</div>
            <div class="box-sub-large">Full • Chapter • HOTS • PYQ</div>
          </div>
          <div class="box-arrow">→</div>
        </button>
      </section>

      <section class="section">
        <button class="action-box action-box-teal action-box-medium" onclick="goTo('analyse.html')">
          <div class="box-icon">📊</div>
          <div class="box-content">
            <div class="box-title">Analyse</div>
            <div class="box-sub">Progress, stats, weak topics</div>
          </div>
          <div class="box-arrow">→</div>
        </button>
      </section>

      <section class="section">
        <div class="box-grid-2">
          <button class="action-box action-box-rose" onclick="goTo('mistakes.html')">
            <div class="box-icon">❌</div>
            <div class="box-title">Mistakes</div>
            <div class="box-sub">Review & redo</div>
          </button>
          <button class="action-box action-box-amber" onclick="goTo('practice.html')">
            <div class="box-icon">🎯</div>
            <div class="box-title">Weak Areas</div>
            <div class="box-sub">Targeted practice</div>
          </button>
        </div>
      </section>

      <section class="section">
        <h3 class="section-title">📜 Recent History</h3>
        <div id="recentTests"></div>
        <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="goTo('history.html')">
          See all history →
        </button>
      </section>

      <section class="section">
        <h3 class="section-title">🎯 Weak Chapters</h3>
        <div id="weakChapters"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item active" href="dashboard.html">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </a>
      <a class="nav-item" href="exams.html">
        <span class="nav-icon">📝</span>
        <span class="nav-label">Exams</span>
      </a>
      <button class="fab" onclick="startExam()" aria-label="Start">
        <span class="fab-icon">+</span>
      </button>
      <a class="nav-item" href="analyse.html">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Analyse</span>
      </a>
      <a class="nav-item" href="profile.html">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </a>
    </nav>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/notification.js"></script>
</body>
</html>

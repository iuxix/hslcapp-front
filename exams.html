<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exams — SEBA HSLC</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="header-top">
        <div class="header-greeting">
          <h2>📝 Exams</h2>
          <p>All exam types</p>
        </div>
        <div class="header-avatar" onclick="window.location.href='profile.html'" style="cursor:pointer">👤</div>
      </div>
    </header>

    <main class="app-main">
      <section class="section">
        <button class="action-box action-box-primary action-box-large" onclick="window.location.href='exam-start.html'">
          <div class="box-icon">🎯</div>
          <div class="box-content">
            <div class="box-title-large">Start Exam</div>
            <div class="box-sub-large">Full • Chapter • AI • HOTS • Theory</div>
          </div>
          <div class="box-arrow">→</div>
        </button>
      </section>

      <section class="section">
        <div class="box-grid-2">
          <button class="action-box action-box-rose" onclick="window.location.href='mistakes.html'">
            <div class="box-icon">❌</div>
            <div class="box-title">Mistakes</div>
            <div class="box-sub">Redo wrong</div>
          </button>
          <button class="action-box action-box-amber" onclick="window.location.href='practice.html'">
            <div class="box-icon">🎯</div>
            <div class="box-title">Weak Areas</div>
            <div class="box-sub">Target weak</div>
          </button>
        </div>
      </section>

      <section class="section">
        <h3 class="section-title">📚 Subjects</h3>
        <div id="subjectsList"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item" href="dashboard.html">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </a>
      <a class="nav-item active" href="exams.html">
        <span class="nav-icon">📝</span>
        <span class="nav-label">Exams</span>
      </a>
      <button class="fab" onclick="window.location.href='exam-start.html'" aria-label="Start">
        <span class="fab-icon">+</span>
      </button>
      <a class="nav-item" href="analyse.html">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Analyse</span>
      </a>
      <a class="nav-item" href="profile.html">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </a>
    </nav>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <div id="modalRoot"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/exams.js"></script>
</body>
</html>
